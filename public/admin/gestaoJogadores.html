<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Jogadores — FMcriol</title>
<link rel="stylesheet" href="gestaoJogadores.css">
</head>
<body>

<header class="topbar">
  <a href="/index.html" class="brand">FM<span>criol</span></a>
  <div>
    <h1>Gestão de Jogadores</h1>
    <p class="subtitle">Cria jogadores por equipa · edita tudo depois no perfil</p>
  </div>
  <span id="apiStatus" class="status-pill status-checking">a verificar servidor…</span>
</header>

<main class="layout">

  <!-- ===== FORMULÁRIO: NOVO JOGADOR ===== -->
  <section class="panel form-panel">
    <h2>Criar jogador</h2>
    <form id="playerForm">
      <label class="field">
        <span>Equipa</span>
        <select id="f_team" required>
          <option value="FREE">Jogador Livre</option>
        </select>
      </label>

      <label class="field">
        <span>Nome completo</span>
        <input type="text" id="f_name" placeholder="ex: Rafael Coronel" required>
      </label>

      <label class="field">
        <span>Nº de camisola</span>
        <input type="text" id="f_jersey" placeholder="ex: 8" value="00">
      </label>

      <div class="field">
        <span>Posição principal</span>
        <div id="positionPrimaryGroup" class="position-picker"><!-- gerado via JS --></div>
      </div>

      <div class="field">
        <span>Posições secundárias <em>(opcional)</em></span>
        <div id="positionSecondaryGroup" class="position-picker"><!-- gerado via JS --></div>
      </div>

      <label class="field">
        <span>Nacionalidade (código)</span>
        <input type="text" id="f_nationality" placeholder="ex: CPV" maxlength="3" value="CPV">
      </label>

      <label class="field">
        <span>Data de nascimento</span>
        <input type="date" id="f_birth">
      </label>

      <button type="submit" class="btn-primary">+ Criar jogador e editar perfil</button>
      <p id="formMsg" class="form-msg"></p>
    </form>
  </section>

  <!-- ===== LISTA DE JOGADORES DA EQUIPA SELECIONADA ===== -->
  <section class="panel list-panel">
    <div class="list-header">
      <h2>Plantel <span id="playerCount" class="count-badge">0</span></h2>
      <select id="filterTeam" class="team-select"></select>
    </div>

    <div id="playerList" class="player-list"></div>
    <p id="emptyState" class="empty-state hidden">Esta equipa ainda não tem jogadores.</p>
  </section>

</main>

<div id="toast" class="toast hidden"></div>

<script src="gestaoJogadores.js"></script>
</body>
</html>
